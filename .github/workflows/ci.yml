name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore PointPilot.sln --runtime win-x64 --locked-mode
      - run: dotnet format PointPilot.sln --verify-no-changes --no-restore --severity warn
      - run: dotnet build PointPilot.sln --configuration Release --no-restore
      - run: dotnet test PointPilot.sln --configuration Release --no-restore --collect:"XPlat Code Coverage"
      - name: CLI smoke - example workflow must validate
        run: dotnet run --project src/PointPilot.Cli/PointPilot.Cli.csproj --configuration Release --no-restore -- validate examples/notepad-demo.yaml
      - run: dotnet publish src/PointPilot.App/PointPilot.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish/win-x64
      # Evaluate against the same RID as the committed lock files; otherwise this
      # implicit restore drops the runtime identifier and fails locked mode (NU1004).
      - run: dotnet list PointPilot.sln package --vulnerable --include-transitive --runtime win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: PointPilot-win-x64
          path: artifacts/publish/win-x64
