[project]
name = "pointpilot"
version = "0.1.0"
description = "A focused, voice-first Windows desktop companion."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "PyQt6>=6.6.0",
    "Pillow>=10.0.0",
    "mss>=9.0.1",
    "numpy>=1.26.0",
    "sounddevice>=0.4.6",
    "httpx>=0.27.0",
    "keyboard>=0.13.5",
    "python-dotenv>=1.0.0",
    "uiautomation>=2.0.18",
    "websocket-client>=1.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8.0"]

[project.scripts]
pointpilot = "pointpilot.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pointpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
